name: Wire BIKUBOO auth launcher
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add auth launcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="auth-launcher.js"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('No closing body tag found')
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s)
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Wire visible auth launcher' && git push)
