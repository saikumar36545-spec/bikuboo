name: Add static mobile header actions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile header markup and styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<!-- BIKUBOO-MOBILE-HEADER -->'
          if marker not in s:
              block='''<!-- BIKUBOO-MOBILE-HEADER -->\n<div id="mobileAuthActions" aria-label="BIKUBOO mobile actions">\n  <button id="mobileInstallStatic" type="button" onclick="document.getElementById('installAppBtn')?.click()">📲 Install</button>\n  <button id="mobileLoginStatic" type="button" onclick="window.openModal&&window.openModal('login')">Log in</button>\n  <button id="mobileSignupStatic" type="button" onclick="window.openModal&&window.openModal('signup')">Create account</button>\n</div>\n<style id="bikuboo-mobile-header-style">\n#mobileAuthActions{display:none}\n@media(max-width:700px){\n  #mobileAuthActions{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:8px;padding:9px 12px;background:#fff;border-bottom:1px solid #e5edf5;position:sticky;top:70px;z-index:9998;box-shadow:0 4px 16px rgba(8,43,85,.08)}\n  #mobileAuthActions button{appearance:none;border:0;border-radius:12px;padding:11px 7px;font:800 13px/1 system-ui,sans-serif;cursor:pointer;white-space:nowrap}\n  #mobileInstallStatic{background:#eaf8d8;color:#315d18}\n  #mobileLoginStatic{background:#eef6ff;color:#123b65}\n  #mobileSignupStatic{background:linear-gradient(135deg,#ff5a1f,#ff7a21);color:#fff}\n}\n@media(max-width:390px){#mobileAuthActions{grid-template-columns:1fr 1fr 1.2fr;gap:6px;padding-left:8px;padding-right:8px}#mobileAuthActions button{font-size:12px;padding-left:4px;padding-right:4px}}\n</style>'''
              s=s.replace('</header>', '</header>'+block, 1)
          tag='<script src="mobile-top-actions.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add static mobile header actions'
          git push