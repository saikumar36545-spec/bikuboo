name: Activate final hero contained fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add final hero stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<link rel="stylesheet" href="hero-contained-final.css?v=1">'
          if tag not in s:
              s=s.replace('</head>', tag+'</head>', 1)
              p.write_text(s)
          PY
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Activate contained premium hero fix' && git push)
