name: Enable BIKUBOO brand logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add brand logo script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="brand-logo.js"></script>'
          if 'src="brand-logo.js"' not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s)
          PY
      - name: Commit logo wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Use BIKUBOO brand logo' && git push)
