name: Inject functional homepage actions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          for f in ['landing-click-fix.js','phone-auth-actions.js','landing-polish.js']:
              tag=f'<script src="{f}"></script>'
              if tag not in s:
                  s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enable functional homepage actions'
          git push
